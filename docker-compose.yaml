services:

  postgres:
    image: pgvector/pgvector:pg16

    container_name: devpilot-postgres

    environment:
      POSTGRES_DB: devpilot
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - devpilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d devpilot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  backend:
    image: yadavsk07/devpilot-backend:${IMAGE_TAG:-latest}

    container_name: devpilot-backend

    ports:
      - "127.0.0.1:8080:8080"

    env_file:
      - backend/.env

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/devpilot

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


volumes:
  devpilot_pg_data: