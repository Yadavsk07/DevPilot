name: DevPilot CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================================
  # 1. BUILD AND TEST SPRING BOOT APPLICATION
  # ==========================================================
  build:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test application
        run: ./mvnw clean package -DskipTests=false


  # ==========================================================
  # 2. BUILD DOCKER IMAGE AND PUSH TO DOCKER HUB
  # ==========================================================
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devpilot-backend:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devpilot-backend:latest


  # ==========================================================
  # 3. DEPLOY TO AWS EC2
  # ==========================================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs: docker

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            echo "======================================"
            echo "Starting DevPilot deployment..."
            echo "======================================"

            cd /opt/devpilot

            echo "Pulling latest Docker image..."

            docker compose pull backend

            echo "Restarting backend..."

            docker compose up -d backend

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "Checking container status..."

            docker compose ps

            echo "======================================"
            echo "DevPilot deployment completed!"
            echo "======================================"
            
